name: Deploy Spring Boot Backend # 工作流名称

on:
  push:
    branches:
      - main # 当代码推送到 'main' 分支时触发
    paths:
      - "backend/web-backend-java-maven/**" # 仅当此路径下的文件发生变化时触发
  workflow_dispatch: # 允许手动触发

env:
  JAVA_VERSION: "17"
  DOCKER_IMAGE_NAME: cucucucu4docker/ucsd-web-backend
  DOCKER_IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: Build Spring Boot JAR
        run: |
          cd backend/web-backend-java-maven
          mvn clean package -DskipTests

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          cd backend/web-backend-java-maven
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }} .
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}

      - name: Deploy to EC2 # 部署阶段
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 使用与 deploy.sh 期望的变量名完全相同的名称
          env:
            UCSD_REG_DB_URL: ${{ secrets.DB_URL }}
            UCSD_REG_DB_USER: ${{ secrets.DB_USER }}
            UCSD_REG_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          script: |
            cd /home/ubuntu/projects/ucsd-web-backend/
            # 直接执行脚本，ssh-action 会确保 sudo 也能访问到这些变量
            sudo ./deploy.sh
