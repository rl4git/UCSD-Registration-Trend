name: Deploy Spring Boot Backend # 工作流名称，会在 GitHub Actions 页面显示

on:
  push:
    branches:
      - main # 当代码推送到 'main' 分支时触发此工作流
    paths:
      - "backend/web-backend-java-maven/**" # 仅当此路径下的文件发生变化时才触发
  workflow_dispatch: # 允许手动从 GitHub Actions 页面触发此工作流

env:
  # 定义一些环境变量，方便在工作流中重复使用
  JAVA_VERSION: "17" # 你的项目使用的 Java 版本
  DOCKER_IMAGE_NAME: cucucucu4docker/ucsd-web-backend # Docker Hub 上的镜像名称（你的Docker ID/仓库名）
  DOCKER_IMAGE_TAG: latest # 镜像标签 (注意: 建议在生产环境使用如 ${{ github.sha }} 的具体标签)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 在最新的 Ubuntu 虚拟机上运行此作业

    steps:
      - name: Checkout code # 步骤1: 拉取代码
        uses: actions/checkout@v4

      - name: Set up Java # 步骤2: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin" # 推荐使用 Temurin OpenJDK

      - name: Cache Maven dependencies # 优化: 添加Maven依赖缓存，提高构建速度
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/backend/web-backend-java-maven/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Spring Boot JAR # 步骤3: 构建 Spring Boot JAR 包
        run: |
          cd backend/web-backend-java-maven
          mvn clean package -DskipTests

      - name: Docker Login (GitHub Actions Runner) # 步骤4: 登录 Docker Hub (在Runner上)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image # 步骤5: 构建并推送 Docker 镜像 (在Runner上)
        run: |
          cd backend/web-backend-java-maven
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }} .
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}

      - name: Deploy to EC2 # 步骤6: 部署到 EC2 服务器
        uses: appleboy/ssh-action@master # 建议固定版本，例如 @v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 使用 env 参数将所有需要的 secrets 和 variables 传递给远程环境
          env:
            # 将 secrets 作为环境变量传递
            DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
            DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
            UCSD_REG_DB_URL: ${{ secrets.DB_URL }}
            UCSD_REG_DB_USER: ${{ secrets.DB_USER }}
            UCSD_REG_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            # 传递其他变量
            DOCKER_IMAGE_NAME_REMOTE: ${{ env.DOCKER_IMAGE_NAME }}
            DOCKER_IMAGE_TAG_REMOTE: ${{ env.DOCKER_IMAGE_TAG }}
          script: |
            #!/bin/bash
            # --- 主流程 ---

            # 0. 在EC2上登录Docker Hub (使用从 `with.env` 传递过来的环境变量)
            echo "Attempting Docker login on EC2..."
            echo "$DOCKER_PASS" | sudo docker login -u "$DOCKER_USER" --password-stdin || {
              echo "ERROR: Docker login on EC2 failed. Aborting deployment."
              exit 1
            }
            echo "Docker login on EC2 successful."

            # 将整个 deploy.sh 的内容粘贴到这里
            # 注意：这里的环境变量 (UCSD_REG_DB_URL, DOCKER_IMAGE_NAME_REMOTE等) 将由 `appleboy/ssh-action` 的 `env` 传递

            # --- 配置 ---
            APP_PORT=8080
            CONTAINER_NAME="ucsd-web-backend-container"
            # Docker Hub 镜像信息将从外部 env 传入 DOCKER_IMAGE_NAME_REMOTE 和 DOCKER_IMAGE_TAG_REMOTE

            # --- 函数定义 ---

            # 检查环境变量是否存在
            check_env_var() {
              local var_name="$1"
              if [ -z "${!var_name}" ]; then
                echo "ERROR: Environment variable '$var_name' is not set."
                exit 1
              fi
            }

            # 停止并移除旧容器的函数
            stop_and_remove_old_container() {
              echo "Checking for existing Docker container named $CONTAINER_NAME..."
              if sudo docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
                echo "Found existing Docker container $CONTAINER_NAME. Stopping and removing it..."
                # 尝试优雅停止，给应用30秒时间关闭
                if ! sudo docker stop -t 30 "$CONTAINER_NAME"; then
                  echo "WARN: Container $CONTAINER_NAME did not stop gracefully. Forcing removal..."
                  sudo docker rm -f "$CONTAINER_NAME"
                else
                  sudo docker rm "$CONTAINER_NAME"
                fi
                echo "Old Docker container removed."
              else
                echo "No existing Docker container named $CONTAINER_NAME found."
              fi
            }

            # 检查应用健康状态的函数
            check_application_health() {
              local check_url="http://localhost:$APP_PORT"
              local max_attempts=10  # 最多尝试 60 次 (10 * 5秒 = 50秒)
              local wait_seconds=5   # 每次尝试间隔 5 秒
              local attempt=1

              echo "Waiting for Spring Boot application to start and become healthy..."
              echo "Checking URL: $check_url"

              while [ $attempt -le $max_attempts ]; do
                echo "Attempt $attempt of $max_attempts: Checking application health..."
                http_code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "$check_url" 2>/dev/null)

                if [[ "$http_code" =~ ^(2|3)[0-9]{2}$ ]]; then
                  echo "SUCCESS: Application is up and running! (HTTP Status: $http_code)"
                  return 0
                else
                  echo "  Application not yet ready (HTTP Status: $http_code). Waiting $wait_seconds seconds..."
                  sleep "$wait_seconds"
                fi
                attempt=$((attempt + 1))
              done

              echo "ERROR: Application did not become healthy after $max_attempts attempts ($((max_attempts * wait_seconds)) seconds)."
              echo "Please check container logs for details: sudo docker logs -f $CONTAINER_NAME"
              return 1
            }

            # --- 脚本主流程 ---

            echo "--- Starting Deployment Process ---"

            # 1. 参数存在性检查 (现在这些变量从 with.env 传入，不需要在脚本中再次定义)
            echo "Checking critical environment variables..."
            # 这里的变量名和 Dockerfile/Spring Boot 应用中的配置保持一致
            check_env_var UCSD_REG_DB_URL
            check_env_var UCSD_REG_DB_USER
            check_env_var UCSD_REG_DB_PASSWORD
            check_env_var DOCKER_IMAGE_NAME_REMOTE # 检查从 GitHub Actions env 传过来的镜像名
            check_env_var DOCKER_IMAGE_TAG_REMOTE  # 检查从 GitHub Actions env 传过来的镜像标签
            echo "All required environment variables are set."


            # 2. 停止并移除旧的 Docker 容器
            stop_and_remove_old_container

            # 3. 拉取最新的 Docker 镜像
            echo "Pulling the latest Docker image: ${DOCKER_IMAGE_NAME_REMOTE}:${DOCKER_IMAGE_TAG_REMOTE}..."
            sudo docker pull "${DOCKER_IMAGE_NAME_REMOTE}:${DOCKER_IMAGE_TAG_REMOTE}" || {
              echo "ERROR: Failed to pull Docker image. Aborting deployment."
              exit 1
            }

            # 4. 运行 Docker 容器
            echo "Starting Spring Boot application using Docker image..."
            CONTAINER_ID=$(sudo docker run -d \
              -p "$APP_PORT:$APP_PORT" \
              --name "$CONTAINER_NAME" \
              -e SPRING_DATASOURCE_URL="$UCSD_REG_DB_URL" \
              -e SPRING_DATASOURCE_USERNAME="$UCSD_REG_DB_USER" \
              -e SPRING_DATASOURCE_PASSWORD="$UCSD_REG_DB_PASSWORD" \
              "${DOCKER_IMAGE_NAME_REMOTE}:${DOCKER_IMAGE_TAG_REMOTE}")

            if [ $? -ne 0 ]; then
              echo "ERROR: Failed to start Docker container '$CONTAINER_NAME'. Aborting deployment."
              exit 1
            fi
            echo "Docker container '$CONTAINER_NAME' (ID: $CONTAINER_ID) started."

            # 5. 等待应用启动并进行健康检查
            if ! check_application_health; then
              echo "FATAL: Application health check failed. Deployment aborted."
              exit 1
            fi

            # 6. 可选：清理旧的、未使用的 Docker 镜像，释放磁盘空间
            echo "Cleaning up old Docker images..."
            sudo docker image prune -f || true # 允许失败，不中断工作流
            echo "Docker image cleanup complete."

            echo "--- Deployment Completed Successfully! ---"
            echo "Application should now be accessible at http://<Your_EC2_IP_Address>:$APP_PORT"
            echo "To view container logs: sudo docker logs -f $CONTAINER_NAME"
            echo "To stop the container: sudo docker stop $CONTAINER_NAME"
